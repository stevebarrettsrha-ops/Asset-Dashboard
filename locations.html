        }
        save(); closeModal(); render();
    }
    function deleteRoom(id) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, id);
        confirmModal(`Delete “${r.title}”?`,
            `This removes the room record and its ${(r.items||[]).length} item(s), and DELETES from the Asset Register every asset whose code is not recorded in another room. This cannot be undone.`, () => {
            if (window.mphAddLocationTombstone) {
                window.mphAddLocationTombstone('rooms', r.id);
                (r.items || []).forEach(it => window.mphTombstoneLocationItem(it));
            }
            const goneItems = (r.items || []).slice();
            d.rooms = d.rooms.filter(x => x.id !== id);
            goneItems.forEach(queueRegisterDelete);   // after the removal — see the guard
            if (selectedRoomId === id) selectedRoomId = null;
            save(); render(); toast('Room deleted', 'success');
        });
    }
    function updateRoomField(id, field, val) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, id); if (!r) return;
        r[field] = val; save(); flashSaved();
        if (field === 'title') renderDeptList();
    }

    /* ============================================================
       CRUD — items
    ============================================================ */
    function addItem() {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        r.items = r.items || [];
        // isNew marks a row that has never been reconciled to the register. It
        // is what stops a brand-new physical item from renaming an existing
        // asset just because someone typed that asset's code into the row
        // first (copying a neighbour's label) before asking for a free one.
        // The dashboard clears it once the row and an asset are paired.
        const it = { id: uid('item'), item: '', description: '', assetCode: '', remarks: '', isNew: true };
        r.items.push(it);
        save();
        const body = document.getElementById('itemsBody');
        let tr;
        if (roomViewTerm.trim()) {
            // A blank new row matches no search, so an active filter would
            // swallow it. Drop the filter and show the whole record instead.
            clearRoomSearch(true);   // the new row takes the focus, not the search box
            tr = body.querySelector('tr[data-id="' + it.id + '"]');
        } else {
            const tmp = document.createElement('tbody');
            tmp.innerHTML = rowHtml(it, r.items.length - 1);
            tr = tmp.firstElementChild;
            body.appendChild(tr);
        }
        if (tr) {
            tr.querySelectorAll('.cell-input').forEach(autoGrow);
            const first = tr.querySelector('.cell-input');
            if (first) first.focus();
        }
        renderDeptList();
    }
    function updateItem(id, field, val) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        const it = r.items.find(x => x.id === id); if (!it) return;
        const before = it[field];
        it[field] = val;
        if (field === 'assetCode') {
            // Typing a code here is a deliberate placement: lift any deletion
            // tombstone on that code so the row isn't pruned by the next merge.
            if (window.mphUntombstoneLocationItem) window.mphUntombstoneLocationItem(it);
            queueCodeChange(it, before, val, d, r);
        } else {
            // description / item / remarks edited here are the same facts the
            // register holds, so the register is updated to match
            queueRegisterChange({ op: 'edit', code: it.assetCode, field: field, value: val,
                itemId: it.id, regId: it.regId || null });
        }
        save(); flashSaved();
    }
    /* Giving a row a code means one of two very different things, and the
       code string alone cannot tell them apart:

         re-code  — this row already IS a register asset (it carries regId, or
                    its previous code matches one); the asset is renamed and
                    the old code kept as an alias.
         create   — this row is a newly surveyed item; the register has never
                    heard of it and must gain an asset.

       Treating the second as the first is what silently renamed an unrelated
       asset and left the new item out of the register entirely, so the two
       stores drifted and duplicates got added by hand to paper over it. */
    function queueCodeChange(it, oldCode, newCode, d, r) {
        // A row added in this session is a newly surveyed item, so it creates
        // an asset — it never re-codes one, whatever code was typed into it
        // on the way. Only a row that already stands for a register asset
        // (linked by regId, or whose previous code is one the register holds)
        // may rename that asset.
        const linked = !it.isNew && (it.regId || codeIsInRegister(oldCode));
        if (linked) {
            queueRegisterChange({ op: 'code', code: newCode, oldCode: oldCode,
                dept: d.name, room: r.title, itemId: it.id, regId: it.regId || null });
        } else {
            queueRegisterChange({ op: 'create', code: newCode, dept: d.name, room: r.title,
                item: it.item || '', description: it.description || it.item || '',
                remarks: it.remarks || '', itemId: it.id });
        }
    }
    /* The Asset Register, read-only, from wherever the freshest copy is.
       Embedded in the dashboard that is its live in-memory inventory; opened
       on its own it is the register's own IndexedDB store, which this page
       reads directly. Either way this page never writes to the register —
       changes go through the queue the dashboard drains. */
    function registerAssets() {
        try {
            if (window.parent && window.parent !== window &&
                typeof window.parent.loadAssetsFromStorage === 'function') {
                const live = Array.isArray(window.parent.allAssetsData) ? window.parent.allAssetsData : [];
                return live.concat(window.parent.loadAssetsFromStorage() || []);
            }
        } catch (e) { /* cross-origin or not embedded — fall through */ }
        return (window.mphGetRegisterAssetsAny && window.mphGetRegisterAssetsAny()) || [];
    }
    /* Does the register already hold this code (as a code or an alias)? */
    function codeIsInRegister(code) {
        if (!code || !window.mphCodeKey) return false;
        const key = window.mphCodeKey(code);
        if (!key) return false;
        return registerAssets().some(a => a && [a.assetCode].concat(a.aliases || [])
            .some(c => window.mphCodeKey(c) === key));
    }
    /* Send a change made here to the Asset Register. The dashboard drains the
       queue on load and whenever it hears the records changed, so this works
       from the embedded frame AND from this page opened on its own. */
    function queueRegisterChange(op) {
        if (!op || !window.mphQueueRegisterChange) return;
        if (!op.code && !op.oldCode) return;        // nothing to match on
        window.mphQueueRegisterChange(op);
    }
    /* Deleting a row here deletes the asset from the Asset Register too.
       Call AFTER the row has been removed from `db`: the guard below asks
       whether any room still lists that code, and hundreds of codes appear on
       more than one room sheet — removing one survey row must not delete an
       asset another room still records. The dashboard re-checks this when it
       drains the queue, so a stale queue entry can't delete the wrong asset. */
    function queueRegisterDelete(it) {
        if (!it || !it.assetCode) return;
        if (window.mphCodeStillInRecords && window.mphCodeStillInRecords(db, it.assetCode)) return;
        queueRegisterChange({ op: 'delete', code: it.assetCode, description: it.description || it.item || '',
            itemId: it.id, regId: it.regId || null });
    }

    /* Assign the next code in series to a Location Records item. The item
       group is inferred from the item's existing/placeholder code or the
       description; the department token + next free sequence produce the
       code. When embedded, the dashboard's fuller series (register +
       inventory + records) is used; standalone, records are scanned. */
    function assignNextSeriesCode(id) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        const it = r.items.find(x => x.id === id); if (!it) return;
        const series = nextCodeSeries(d.name);
        if (!series.length) { toast('No existing coded series for this department yet — enter the first code manually.', 'error'); return; }
        // infer the item group from the current code, else pick the group
        // whose description best matches this item
        let group = null;
        const p = window.mphParseCode && it.assetCode ? window.mphParseCode(it.assetCode) : null;
        if (p && p.item) group = String(p.item);
        let chosen = group ? series.find(s => s.group === group) : null;
        if (!chosen) {
            const hay = ((it.item || '') + ' ' + (it.description || '')).toLowerCase();
            chosen = series.find(s => s.desc && hay && (hay.indexOf(s.desc.toLowerCase().split(',')[0]) >= 0 ||
                s.desc.toLowerCase().split(',')[0].indexOf(hay.split(' ')[0]) >= 0));
        }
        if (!chosen) {
            // let the user pick from the series list
            openSeriesPickModal(id, series);
            return;
        }
        applySeriesCode(id, chosen.nextCode);
    }
    /* Next code in each series for a department.
       Computed by the shared engine in asset-normalizer.js over BOTH stores —
       the Asset Register (including historical aliases) and the Location
       Records — so the number offered here is the number the register itself
       would issue. This page used to scan only its own items when it could not
       reach the dashboard, which meant every asset added on the register side
       since the last survey was invisible and the code offered here collided
       with one already in use. */
    function nextCodeSeries(deptName) {
        return window.mphComputeNextCodeSeries(deptName, registerAssets(), db, boardedCodes());
    }
    /* Codes the Board of Survey has written off. Their numbers are spent even
       after the asset leaves the register, so they must never be offered
       again. */
    function boardedCodes() {
        try {
            if (window.parent && window.parent !== window &&
                typeof window.parent.getDisposedAssetCodes === 'function') {
                return [...window.parent.getDisposedAssetCodes()];
            }
        } catch (e) { /* not embedded — read our own copy */ }
        return (window.mphGetDisposalRecordsAny ? window.mphGetDisposalRecordsAny() : [])
            .map(r => r && r.assetCode).filter(Boolean);
    }
    function openSeriesPickModal(id, series) {
        const rows = series.map(s => `<div class="move-room-row" onclick="applySeriesCode('${id}', '${s.nextCode}')">
            <span style="flex:1;">${esc(s.group)}${s.desc ? ' — ' + esc(s.desc) : ''}</span>
            <span style="font-family:monospace; font-weight:700; color:#27ae60;">${esc(s.nextCode)}</span></div>`).join('');
        document.getElementById('modalBox').innerHTML = `
            <h3>Assign next code in series</h3>
            <p class="sub">Pick the item group — the next free number is assigned.</p>
            <div class="move-modal-list">${rows}</div>
            <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`;
        openModal();
    }
    function applySeriesCode(id, code) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        const it = r.items.find(x => x.id === id); if (!it) return;
        const oldCode = it.assetCode;
        it.assetCode = code;
        // deliberate placement — see updateItem()
        if (window.mphUntombstoneLocationItem) window.mphUntombstoneLocationItem(it);
        queueCodeChange(it, oldCode, code, d, r);
        save(); closeModal();
        renderRoom(document.getElementById('content'));
        growAllCells();
        toast('Assigned ' + code, 'success');
    }
    function deleteItem(id) {
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        const it = (r.items || []).find(x => x.id === id);
        // This now also removes the asset from the Asset Register (cost,
        // depreciation and all), so it is no longer a silent one-click action.
        if (it && it.assetCode && window.mphCodeStillInRecords &&
            !window.mphCodeStillInRecords({ departments: db.departments.map(dep => ({
                rooms: (dep.rooms || []).map(rr => ({
                    items: (rr.items || []).filter(x => x.id !== id) })) })) }, it.assetCode)) {
            const label = (it.description || it.item || it.assetCode);
            if (!confirm('Delete "' + label + '" (' + it.assetCode + ')?\n\n' +
                         'This is the last record of this asset code, so the asset will also be ' +
                         'DELETED FROM THE ASSET REGISTER — its cost and depreciation leave every ' +
                         'total and report.\n\nThis cannot be undone.')) return;
        }
        doDeleteItem(id, d, r, it);
    }
    function doDeleteItem(id, d, r, it) {
        // Tombstone by row id AND asset code. An id-only tombstone let the
        // same physical item return under a different id (the seed's, another
        // device's, a restored backup's) on the very next merge.
        if (window.mphTombstoneLocationItem) window.mphTombstoneLocationItem(it || { id: id });
        else if (window.mphAddLocationTombstone) window.mphAddLocationTombstone('items', id);
        // a deleted item is no longer "placed" anywhere
        if (it && window.mphForgetLocationMove) window.mphForgetLocationMove(it);
        r.items = r.items.filter(x => x.id !== id);
        queueRegisterDelete(it);
        save(); renderRoom(document.getElementById('content'));
        growAllCells();
        renderDeptList();
    }

    /* ============================================================
       Move an item to another room/department. Built for emptying the
       "Register Items — Room Not Yet Assigned" bucket: pick a target
       room and the item moves there (kept out of the source), and the
       matching asset in the main register is re-homed to that room too.
    ============================================================ */
    let _moveItemId = null;
    function openMoveItemModal(itemId) {
        _moveItemId = itemId;
        const d = getDept(selectedDeptId);
        const r = getRoom(d, selectedRoomId);
        const it = r && (r.items || []).find(x => x.id === itemId);
        if (!it) return;
        const label = (it.item || it.description || 'item') + (it.assetCode ? ' (' + it.assetCode + ')' : '');
        document.getElementById('modalBox').innerHTML = `
            <h3>Move item to a room</h3>
            <p class="sub">Moving <b>${esc(label)}</b><br>from ${esc(d.name)} › ${esc(r.title)}.</p>
            <input type="text" id="moveSearch" placeholder="Search departments and rooms..." oninput="renderMoveTargets()"
                   style="width:100%; padding:9px 12px; border:1px solid var(--border-color); border-radius:8px; font-size:0.85rem;">
            <div class="move-modal-list" id="moveTargets"></div>
            <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`;
        openModal();
        renderMoveTargets();
        setTimeout(() => { const s = document.getElementById('moveSearch'); if (s) s.focus(); }, 50);
    }
    function renderMoveTargets() {
        const box = document.getElementById('moveTargets');
        if (!box) return;
        const term = (document.getElementById('moveSearch') || {}).value || '';
        const t = term.toLowerCase().trim();
        let html = '';
        db.departments.forEach(dep => {
            const isSourceDept = dep.id === selectedDeptId;
            const rooms = (dep.rooms || []).filter(r =>
                r.id !== selectedRoomId && !/Room Not Yet Assigned/i.test(r.title || ''));
            const deptHit = (dep.name || '').toLowerCase().includes(t);
            const shown = t ? rooms.filter(r => deptHit || (r.title || '').toLowerCase().includes(t)) : rooms;
            if (t && !deptHit && !shown.length) return;
            const dn = String(dep.id);
            html += `<div class="move-dept-row" onclick="moveItemTo('${dn}', '')">
                <span>${esc(dep.icon || '🏢')}</span><span style="flex:1;">${esc(dep.name)}</span>
                <span style="font-weight:400; font-size:0.72rem; color:var(--text-secondary,#7078a0);">${rooms.length} room${rooms.length === 1 ? '' : 's'} · move to dept</span></div>`;
            shown.forEach(r => {
                html += `<div class="move-room-row" onclick="moveItemTo('${dn}', '${String(r.id)}')">
                    <span style="flex:1;">${esc(r.title)}</span>
                    <span style="font-size:0.7rem; color:var(--text-secondary,#7078a0);">${(r.items || []).length} items</span></div>`;
            });
            if (!t || deptHit) {
                html += `<div class="move-opt-row" onclick="moveItemNewRoom('${dn}')">＋ New room…</div>`;
            }
        });
        box.innerHTML = html || '<div style="padding:16px; text-align:center; color:var(--text-secondary,#7078a0); font-size:0.85rem;">No matching room.</div>';
    }
    function moveItemNewRoom(deptId) {
        const title = prompt('New room title:');
        if (!title || !title.trim()) return;
        const dep = getDept(deptId);
        const room = { id: uid('room'), title: title.trim(), verifiedBy: '', dateUpdated: '', note: '', items: [] };
        dep.rooms.push(room);
        moveItemTo(deptId, room.id);
    }
    function moveItemTo(destDeptId, destRoomId) {
        const srcDept = getDept(selectedDeptId);
        const srcRoom = getRoom(srcDept, selectedRoomId);
        const idx = srcRoom.items.findIndex(x => x.id === _moveItemId);
        if (idx < 0) { closeModal(); return; }
        const it = srcRoom.items[idx];
        const destDept = getDept(destDeptId);
        let destRoom = destRoomId ? getRoom(destDept, destRoomId) : null;
        if (!destRoom) {
            // "move to department" → its register bucket, created if needed
            const bucketTitle = 'Register Items — Room Not Yet Assigned';
            destRoom = (destDept.rooms || []).find(r => String(r.title).trim().toLowerCase() === bucketTitle.toLowerCase());
            if (!destRoom) { destRoom = { id: uid('room'), title: bucketTitle, verifiedBy: '', dateUpdated: '', note: '', items: [] }; destDept.rooms.push(destRoom); }
        }
        // remove from source, add to destination (dedupe by code within dest)
        srcRoom.items.splice(idx, 1);
        destRoom.items = destRoom.items || [];
        const key = window.mphCodeKey && it.assetCode ? window.mphCodeKey(it.assetCode) : null;
        const dup = key && destRoom.items.find(x => window.mphCodeKey(x.assetCode) === key);
        if (!dup) {
            destRoom.items.push(it);
        } else {
            // same code already there: don't drop the moved row's data —
            // fill any blank fields on the existing item from the moved one
            ['item', 'description', 'remarks'].forEach(f => { if (!dup[f] && it[f]) dup[f] = it[f]; });
        }
        // Remember the transfer. Without this the next merge of an older copy
        // of the records (cloud backup, re-applied seed, a peer device) put
        // the item straight back in the department it just left.
        if (window.mphUntombstoneLocationItem) window.mphUntombstoneLocationItem(dup || it);
        if (window.mphRecordLocationMove) {
            window.mphRecordLocationMove(dup || it, destDept.name, destRoom.title,
                                         { dept: srcDept.name, room: srcRoom.title });
        }
        // Re-home the matching register asset. Queued (not called directly on
        // the parent) so the transfer also reaches the register when this page
        // is open on its own, with the dashboard closed.
        queueRegisterChange({
            op: 'place',
            code: (dup || it).assetCode,
            dept: destDept.name,
            room: destRoom.title.indexOf('Not Yet Assigned') >= 0 ? '' : destRoom.title,
            itemId: (dup || it).id,
            regId: (dup || it).regId || null
        });
        save();
        // apply immediately when embedded, so the register view behind the
        // frame updates without waiting for a reload
        try {
            if (window.parent && window.parent !== window && typeof window.parent.drainLocationRegisterQueue === 'function') {
                window.parent.drainLocationRegisterQueue();
            }
        } catch (e) { /* standalone page: the dashboard drains it on next load */ }
        closeModal();
        selectedDeptId = destDeptId; selectedRoomId = destRoom.id;
        render(); window.scrollTo(0, 0);
        growAllCells();
        toast('Item moved to ' + destDept.name + ' › ' + destRoom.title, 'success');
    }

    function flashSaved() {
        const h = document.getElementById('saveHint');
        if (!h) return;
        h.textContent = '✓ Saved';
        h.classList.add('saved');
        clearTimeout(h._t);
        h._t = setTimeout(() => { h.textContent = 'All changes save automatically'; h.classList.remove('saved'); }, 1500);
    }

    /* ============================================================
       Modal helpers
    ============================================================ */
    function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
    function confirmModal(title, msg, onYes) {
        document.getElementById('modalBox').innerHTML = `
            <h3>${esc(title)}</h3>
            <p class="sub">${esc(msg)}</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmYes">Delete</button>
            </div>`;
        openModal();
        document.getElementById('confirmYes').onclick = () => { closeModal(); onYes(); };
    }
    document.getElementById('modalOverlay').addEventListener('click', e => {
        if (e.target.id === 'modalOverlay') closeModal();
    });

    /* ============================================================
       PRINT / PREVIEW  (matches the attached PDF form)
    ============================================================ */
    // Build one record. `mode` = 'print' (footer via @page counter) or
    // 'preview' (on-screen page footer text).
    function recordHtml(dept, room, mode) {
        const items = (room.items || []);
        let rows = items.map(it => `
            <tr>
                <td>${esc(it.item||'')}</td>
                <td>${esc(it.description||'')}</td>
                <td>${esc(it.assetCode||'')}</td>
                <td>${esc(it.remarks||'')}</td>
            </tr>`).join('');
        // Pad with blank rows so the sheet matches the official one-page form
        const pad = Math.max(0, MIN_PRINT_ROWS - items.length);
        for (let i = 0; i < pad; i++) {
            rows += `<tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`;
        }
        const pagefoot = (mode === 'preview') ? '<div class="pr-pagefoot">Page 1 of 1</div>' : '';
        return `
        <div class="print-record">
            <div class="pr-runhead">
                ${letterheadHtml()}
                <div class="pr-title">LOCATION RECORD</div>
                <div class="pr-infobox">
                    <div class="pr-field"><span class="k">Location:</span> ${esc(dept.name)}</div>
                    <div class="pr-field"><span class="k">Room Title:</span> ${esc(room.title)}</div>
                    <div class="pr-field"><span class="k">Verified by and date:</span> ${esc(room.verifiedBy||'')}</div>
                    <div class="pr-field"><span class="k">Date updated:</span> ${esc(room.dateUpdated||'')}</div>
                </div>
            </div>
            <table class="pr-items">
                <thead>
                    <tr>
                        <th style="width:27.4%">Item</th>
                        <th style="width:22.6%">Description/Make</th>
                        <th style="width:22.9%">Asset Code</th>
                        <th style="width:27.1%">Remarks</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
            <div class="pr-note"><em>${esc(APPROVAL_NOTE)}</em></div>
            ${pagefoot}
        </div>`;
    }

    // Returns an array of record HTML strings for the given scope.
    function collectRecordsList(scope, deptId, roomId, mode) {
        const out = [];
        if (scope === 'room') {
            const d = getDept(deptId); const r = getRoom(d, roomId);
            if (d && r) out.push(recordHtml(d, r, mode));
        } else if (scope === 'dept') {
            const d = getDept(deptId);
            if (d) d.rooms.forEach(r => out.push(recordHtml(d, r, mode)));
        } else {
            db.departments.forEach(d => d.rooms.forEach(r => out.push(recordHtml(d, r, mode))));
        }
        return out;
    }

    function printRecords(scope, deptId, roomId) {
        const recs = collectRecordsList(scope, deptId, roomId, 'print');
        if (!recs.length) { toast('Nothing to print', 'error'); return; }
        document.getElementById('printArea').innerHTML = recs.join('');
        setTimeout(() => window.print(), 60);
    }

    let previewScope = null, previewArgs = [];
    function openPreview(scope, deptId, roomId) {
        previewScope = scope; previewArgs = [deptId, roomId];
        const scroll = document.getElementById('previewScroll');
        const title = document.getElementById('previewTitle');
        const pages = collectPreviewPages(scope, deptId, roomId);
        if (!pages) { toast('Nothing to preview', 'error'); return; }
        scroll.innerHTML = pages;
        title.textContent = scope === 'room' ? 'Live Preview — Room Record'
                          : scope === 'dept' ? 'Live Preview — ' + (getDept(deptId) ? getDept(deptId).name : 'Department')
                          : 'Live Preview — All Department Records';
        document.getElementById('previewOverlay').classList.add('open');
    }
    function collectPreviewPages(scope, deptId, roomId) {
        let pages = [];
        const wrap = h => `<div class="preview-page">${h}</div>`;
        if (scope === 'room') {
            const d = getDept(deptId); const r = getRoom(d, roomId);
            if (d && r) pages.push(wrap(recordHtml(d, r, 'preview')));
        } else if (scope === 'dept') {
            const d = getDept(deptId);
            if (d) { if (!d.rooms.length) pages.push(wrap('<p style="text-align:center;color:#888;">No rooms in this department yet.</p>')); d.rooms.forEach(r => pages.push(wrap(recordHtml(d, r, 'preview')))); }
        } else {
            db.departments.forEach(d => d.rooms.forEach(r => pages.push(wrap(recordHtml(d, r, 'preview')))));
            if (!pages.length) pages.push(wrap('<p style="text-align:center;color:#888;">No records yet.</p>'));
        }
        return pages.join('');
    }
    function closePreview() { document.getElementById('previewOverlay').classList.remove('open'); }
    function printFromPreview() {
        printRecords(previewScope, previewArgs[0], previewArgs[1]);
    }

    /* ============================================================
       Backup / Restore
    ============================================================ */
    function exportData() {
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'location-records-backup.json';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('Backup downloaded', 'success');
    }
    function importData(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data || !Array.isArray(data.departments)) throw new Error('bad');
                const roomCount = data.departments.reduce((s, d) => s + (d.rooms ? d.rooms.length : 0), 0);
                importChoiceModal(data, data.departments.length + ' departments, ' + roomCount + ' rooms');
            } catch (err) { toast('Invalid backup file', 'error'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    // Restore dialog: let the user Merge (add without deleting) or Replace.
    function importChoiceModal(data, summary) {
        document.getElementById('modalBox').innerHTML = `
            <h3>Restore from backup</h3>
            <p class="sub">The file contains ${esc(summary)}.<br><br>
            <b>Merge</b> adds new departments, rooms and items to your current records — nothing you already have is removed.<br>
            <b>Replace</b> discards your current records and keeps only the file.</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-ghost" id="importReplaceBtn">Replace</button>
                <button class="btn btn-primary" id="importMergeBtn">Merge</button>
            </div>`;
        openModal();
        document.getElementById('importMergeBtn').onclick = () => {
            closeModal();
            const r = mergeIntoDb(data); _reconcileAfterImport(); save(); goHome();
            toast('Merged: +' + r.addedDepts + ' depts, +' + r.addedRooms + ' rooms, +' + r.addedItems + ' items', 'success');
        };
        document.getElementById('importReplaceBtn').onclick = () => {
            closeModal();
            // deletions and transfers still hold — a backup file is not a
            // licence to resurrect what the user removed or un-move what
            // they transferred
            db = data; _reconcileAfterImport(); save(); goHome();
            toast('Records replaced', 'success');
        };
    }

    /* ============================================================
       Merge a backup into the current records without deleting.
       - Departments are matched by name, rooms by title.
       - New departments/rooms are added outright (with fresh ids).
       - For a room present on both sides, items are combined so that
         each distinct item (item + description + assetCode + remarks)
         ends up with the larger of the two counts. This preserves the
         user's own entries, fills in anything missing, keeps legitimate
         duplicates, and is idempotent (re-importing adds nothing new).
    ============================================================ */
    function _itemSig(it) {
        return [it.item, it.description, it.assetCode, it.remarks]
            .map(s => String(s == null ? '' : s).trim().toLowerCase()).join('||');
    }
    // A restore gives every incoming row a fresh id, so an id-only tombstone
    // never matched and deleted items walked back in with the backup. Filter
    // the incoming side through the tombstones (which now also key on the
    // asset code) before anything is adopted.
    function _liveIncoming(items) {
        return (items || []).filter(it =>
            !(window.mphIsItemTombstoned && window.mphIsItemTombstoned(it)));
    }
    // Re-assert deletions and transfers after any restore.
    function _reconcileAfterImport() {
        let changed = false;
        if (window.mphPruneTombstoned) changed = window.mphPruneTombstoned(db) || changed;
        if (window.mphApplyLocationMoves) changed = window.mphApplyLocationMoves(db) || changed;
        return changed;
    }
    function _countAllItems() {
        return db.departments.reduce((s, d) => s + d.rooms.reduce((t, r) => t + (r.items ? r.items.length : 0), 0), 0);
    }
    function _freshRoom(room) {
        return {
            id: uid('room'), title: room.title || '',
            verifiedBy: room.verifiedBy || '', dateUpdated: room.dateUpdated || '', note: room.note || '',
            items: _liveIncoming(room.items).map(it => ({
                id: uid('item'), item: it.item || '', description: it.description || '',
                assetCode: it.assetCode || '', remarks: it.remarks || ''
            }))
        };
    }
    function _mergeRoomItems(existingRoom, incomingRoom) {
        existingRoom.items = existingRoom.items || [];
        const existingCounts = {};
        existingRoom.items.forEach(it => { const s = _itemSig(it); existingCounts[s] = (existingCounts[s] || 0) + 1; });
        const incGroups = {};
        _liveIncoming(incomingRoom.items).forEach(it => { const s = _itemSig(it); (incGroups[s] = incGroups[s] || []).push(it); });
        Object.keys(incGroups).forEach(s => {
            const deficit = incGroups[s].length - (existingCounts[s] || 0);
            for (let i = 0; i < deficit; i++) {
                const src = incGroups[s][i];
                existingRoom.items.push({
                    id: uid('item'), item: src.item || '', description: src.description || '',
                    assetCode: src.assetCode || '', remarks: src.remarks || ''
                });
            }
        });
    }
    function mergeIntoDb(incoming) {
        const norm = s => String(s == null ? '' : s).trim().toLowerCase();
        let addedDepts = 0, addedRooms = 0;
        const itemsBefore = _countAllItems();
        (incoming.departments || []).forEach(incDept => {
            let dept = db.departments.find(d => norm(d.name) === norm(incDept.name));
            if (!dept) {
                dept = {
                    id: uid('dept'), name: incDept.name || '', icon: incDept.icon || '🏢',
                    location: incDept.location || incDept.name || '', note: incDept.note || '', rooms: []
                };
                db.departments.push(dept); addedDepts++;
            }
            (incDept.rooms || []).forEach(incRoom => {
                const room = dept.rooms.find(r => norm(r.title) === norm(incRoom.title));
                if (!room) { dept.rooms.push(_freshRoom(incRoom)); addedRooms++; }
                else { _mergeRoomItems(room, incRoom); }
            });
        });
        return { addedDepts, addedRooms, addedItems: _countAllItems() - itemsBefore };
    }
    function confirmModalGeneric(title, msg, btnLabel, onYes) {
        document.getElementById('modalBox').innerHTML = `
            <h3>${esc(title)}</h3><p class="sub">${esc(msg)}</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="confirmYes2">${esc(btnLabel)}</button>
            </div>`;
        openModal();
        document.getElementById('confirmYes2').onclick = () => { closeModal(); onYes(); };
    }

    /* ============================================================
       Utils
    ============================================================ */
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }
    function toast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (type || '');
        clearTimeout(t._t);
        t._t = setTimeout(() => t.className = 'toast', 2200);
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeModal(); closePreview(); closeLocPicker(); }
    });

    /* ============================================================
       Embedded mode (inside index.html) + cross-context freshness
    ============================================================ */
    (function () {
        // Hide navigation that would duplicate the dashboard's own chrome
        // when this page runs inside the dashboard's Location Records page.
        let embedded = false;
        try { embedded = new URLSearchParams(window.location.search).get('embedded') === '1'; } catch (e) {}
        if (embedded) document.body.classList.add('embedded');

        function applyExternal(d) {
            if (d && Array.isArray(d.departments)) { db = d; render(); }
        }
        function reloadFromStorage() {
            try {
                if (window.mphRefreshLocationRecords) {
                    window.mphRefreshLocationRecords().then(applyExternal);
                } else {
                    applyExternal(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'));
                }
            } catch (e) { /* keep current view */ }
        }
        // Another tab or frame saved through the shared store.
        if (window.mphOnLocationRecordsUpdated) {
            window.mphOnLocationRecordsUpdated(() => applyExternal(window.mphGetLocationRecordsAny && window.mphGetLocationRecordsAny()));
        }
        // Legacy path: another tab still writing records to localStorage.
        window.addEventListener('storage', e => {
            if (e.key === STORAGE_KEY && e.newValue) reloadFromStorage();
        });
        // The dashboard merged cloud data and asks us to refresh.
        window.addEventListener('message', e => {
            if (e.origin !== window.location.origin) return;
            if (e.data && e.data.type === 'mph-location-records-reload') { reloadFromStorage(); refreshRegisterCache(); }
        });
    })();

    /* ============================================================
       Init — wait for the IndexedDB-backed store (it also migrates any
       legacy localStorage records on first run), then load + render.
    ============================================================ */
    /* Re-flow the record whenever the available width changes: rotating the
       phone, the on-screen keyboard opening, or the dashboard iframe being
       resized all rewrap the item cells. Debounced so a drag-resize does not
       re-measure on every frame. */
    (function () {
        let t = null;
        function reflow() { clearTimeout(t); t = setTimeout(growAllCells, 120); }
        window.addEventListener('resize', reflow);
        window.addEventListener('orientationchange', reflow);
        // Web fonts land after first paint and change the wrap points.
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(growAllCells).catch(() => {});
    })();

    function startPage() {
        load(); render();
        // Standalone, the register is only reachable by reading its own store.
        // Load it so the first code lookup already knows every issued number;
        // the page works either way, it is just better informed once this
        // resolves.
        if (window.mphLoadRegisterAssets) {
            window.mphLoadRegisterAssets().catch(() => {});
        }
    }
    /* The dashboard drained the queue or synced — our register copy is stale. */
    function refreshRegisterCache() {
        if (!window.mphInvalidateRegisterAssets || !window.mphLoadRegisterAssets) return;
        window.mphInvalidateRegisterAssets();
        window.mphLoadRegisterAssets().catch(() => {});
    }
    if (window.mphLocationStoreReady && typeof window.mphLocationStoreReady.then === 'function') {
        window.mphLocationStoreReady.then(startPage);
    } else {
        startPage();
    }
    </script>
